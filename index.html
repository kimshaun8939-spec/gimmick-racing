<!doctype html>
<html lang="ko">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2724%27 fill=%27%23ffcc45%27/%3E%3Ctext x=%2750%27 y=%2772%27 text-anchor=%27middle%27 font-size=%2770%27%3E🏁%3C/text%3E%3C/svg%3E">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>기믹 레이싱</title>
  <style>
    :root {
      --hud-bg: rgba(12, 16, 26, 0.55);
      --hud-fg: #f5f7fb;
      --accent: #ffcf3f;
      --blue: #4fc3ff;
      --orange: #ff9a2e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc9f0; font-family: "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif; color: var(--hud-fg); }
    canvas#game { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.45); }
    .panel { background: var(--hud-bg); border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(4px); }
    #topLeft { top: 16px; left: 16px; display: grid; gap: 4px; min-width: 180px; }
    #lap { font-size: 28px; font-weight: 800; }
    #time { font-size: 22px; font-variant-numeric: tabular-nums; }
    #best { font-size: 14px; opacity: 0.8; font-variant-numeric: tabular-nums; }
    #speedBox { right: 16px; bottom: 16px; text-align: right; }
    #speed { font-size: 56px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    #speed { transition: color 0.3s, text-shadow 0.3s; }
    #speed.fast { color: #ffe9c4; text-shadow: 0 0 14px rgba(255, 140, 50, 0.65), 0 2px 6px rgba(0,0,0,0.45); }
    #speed.boost { color: #e6ffe0; text-shadow: 0 0 16px rgba(125, 255, 106, 0.75), 0 2px 6px rgba(0,0,0,0.45); }
    #speedUnit { font-size: 14px; opacity: 0.8; }
    #driftBar { margin-top: 8px; width: 180px; height: 10px; border-radius: 6px; background: rgba(255,255,255,0.2); overflow: hidden; margin-left: auto; }
    #driftFill { height: 100%; width: 0%; background: #fff; transition: background 0.1s; }
    /* 드리프트 각도 막대 (드리프트 중에만): 초록 칸 안에 바늘을 두면 드리프트가 쌓임 */
    #driftAng { position: relative; margin: 5px 0 0 auto; width: 180px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.14); opacity: 0; transition: opacity 0.2s; }
    #driftAng.on { opacity: 1; }
    #driftWin { position: absolute; top: 0; bottom: 0; background: rgba(92,255,138,0.45); border-radius: 3px; }
    #driftNeedle { position: absolute; top: -3px; width: 4px; height: 14px; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,0.6); }
    #driftNeedle.in { background: #5cff8a; }
    #driftNeedle.over { background: #ff5a4a; }
    /* 회전수계 + 기어 */
    #tachRow { display: flex; align-items: center; gap: 10px; margin-top: 8px; justify-content: flex-end; }
    #gear { font-size: 34px; font-weight: 900; min-width: 30px; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
    #gear.shifting { opacity: 0.45; }
    #tach { position: relative; width: 180px; height: 14px; border-radius: 7px; background: rgba(255,255,255,0.18); overflow: hidden; }
    #tachFill { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, #7fd6ff, #ffffff 60%, #ffcf3f 85%, #ff4b3a); }
    #tachRed { position: absolute; top: 0; bottom: 0; right: 0; background: rgba(255, 60, 50, 0.35); border-left: 2px solid #ff4b3a; }
    #tachGreen { position: absolute; top: 0; bottom: 0; background: rgba(125, 255, 106, 0.45); border: 2px solid #7dff6a; border-radius: 4px; display: none; }
    #tach.shiftNow { box-shadow: 0 0 12px #7dff6a; }
    #tach.limiter { animation: limiter 0.08s infinite alternate; }
    @keyframes limiter { from { box-shadow: 0 0 10px #ff4b3a; } to { box-shadow: none; } }
    #gearInfo { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 12px; }
    #gearMode { opacity: 0.75; }
    #tireState { font-weight: 800; }
    #shiftPerfect { color: #7dff6a; font-weight: 800; opacity: 0; transition: opacity 0.4s; }
    /* 왼쪽 위 기둥: 랩·시간 패널 + (레이스) 순위 패널 */
    #leftCol { top: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    /* 구간(섹터) 기록: F1 색 (보라 = 전체 최고, 초록 = 내 최고, 노랑 = 느림) */
    #sectorRow { display: none; gap: 4px; margin-top: 2px; }
    #sectorRow.on { display: flex; }
    #sectorRow .sec { flex: 1; min-width: 58px; padding: 2px 5px 3px; border-radius: 6px; background: rgba(255,255,255,0.12); font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.15; border-bottom: 3px solid transparent; transition: background 0.25s; }
    #sectorRow .sec b { display: block; font-size: 10px; opacity: 0.7; }
    #sectorRow .sec.live { border-bottom-color: #ffffff88; }
    #sectorRow .sec.purple { background: rgba(180, 92, 255, 0.55); border-bottom-color: #c98bff; }
    #sectorRow .sec.green { background: rgba(46, 204, 96, 0.5); border-bottom-color: #5cff8a; }
    #sectorRow .sec.yellow { background: rgba(255, 200, 40, 0.42); border-bottom-color: #ffd23a; }
    #sectorRow .sec.flash { animation: secFlash 0.9s ease-out; }
    @keyframes secFlash { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
    #ghostDelta { display: none; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
    #ghostDelta.on { display: block; }
    #ghostDelta small { font-size: 11px; font-weight: 600; opacity: 0.75; margin-right: 6px; }
    /* 레이스 순위: P3/6 + 앞·뒤 차 간격 + 순위표 */
    #raceBox { display: none; min-width: 180px; padding: 8px 10px; }
    #raceBox.on { display: block; }
    #racePos { font-size: 34px; font-weight: 900; line-height: 1; font-family: "Black Han Sans", "Pretendard", sans-serif; letter-spacing: 0.02em; }
    #racePos small { font-size: 16px; opacity: 0.7; margin-left: 2px; }
    #racePos.up { animation: posUp 0.8s ease-out; }
    @keyframes posUp { 0% { color: #7dff6a; transform: scale(1.2); } 100% { color: inherit; transform: scale(1); } }
    #racePos.down { animation: posDown 0.8s ease-out; }
    @keyframes posDown { 0% { color: #ff6b5e; } 100% { color: inherit; } }
    #raceGaps { font-size: 12px; margin: 4px 0 6px; font-variant-numeric: tabular-nums; line-height: 1.4; }
    #raceGaps .a { color: #ffb3a8; }
    #raceGaps .b { color: #b8f5c5; }
    #tower { display: grid; gap: 2px; font-size: 13px; }
    #tower .tw { display: grid; grid-template-columns: 18px 5px 1fr auto; gap: 6px; align-items: center; padding: 2px 6px 2px 4px; border-radius: 5px; background: rgba(255,255,255,0.06); font-variant-numeric: tabular-nums; }
    #tower .tw.me { background: rgba(255, 207, 63, 0.3); font-weight: 800; }
    #tower .tw b { text-align: right; opacity: 0.85; }
    #tower .tw i { width: 5px; height: 14px; border-radius: 2px; }
    #tower .tw span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 92px; }
    #tower .tw em { font-style: normal; font-size: 11px; opacity: 0.85; }
    #tower .tw.done em { color: #ffd23a; }
    /* 바퀴 끝 요약 (구간 색) */
    #lapSum { left: 50%; top: calc(22% + 48px); transform: translateX(-50%); display: flex; gap: 6px; align-items: center; font-size: 15px; font-weight: 800; opacity: 0; transition: opacity 0.4s; font-variant-numeric: tabular-nums; }
    #lapSum .sx { padding: 2px 8px; border-radius: 6px; font-size: 13px; }
    #lapSum .sx.purple { background: rgba(180, 92, 255, 0.75); }
    #lapSum .sx.green { background: rgba(46, 204, 96, 0.7); }
    #lapSum .sx.yellow { background: rgba(230, 180, 30, 0.7); }
    @media (max-width: 640px) { #tower { display: none; } }
    /* 결과 화면: 레이스 순위표·구간 기록표 (기본 결과 화면 스타일은 menu.css) */
    #results .res.wide { width: min(660px, calc(100vw - 32px)); max-height: calc(100vh - 24px); overflow-y: auto; }
    #results table.stand { margin-top: 12px; font-size: 14px; }
    #results .online { margin-top: 8px; font-size: 13px; color: #9fd8ff; }
    #results .online:empty { display: none; }
    #results table.stand tr.hd td, #results table.secs tr.hd td { font-size: 11px; opacity: 0.6; font-weight: 800; }
    #results table.stand td.nm { text-align: left; white-space: nowrap; }
    #results table.stand td.nm i { display: inline-block; width: 6px; height: 14px; border-radius: 2px; margin-right: 7px; vertical-align: -2px; }
    #results table.stand td.nm small { margin-left: 6px; opacity: 0.55; font-size: 11px; }
    #results table.stand tr.me { background: rgba(255, 207, 63, 0.18); font-weight: 800; }
    #results table.stand .proj { opacity: 0.6; }
    #results table.secs { font-size: 13px; margin-top: 4px; }
    #results table.secs tr.theo td { font-size: 12px; opacity: 0.8; padding-top: 6px; }
    /* 코너 분석 (결과 화면) */
    #results .cana { margin-top: 12px; text-align: left; font-size: 13px; }
    #results .cana .hd { font-weight: 900; font-size: 14px; margin-bottom: 6px; }
    #results .cana .hd small { font-weight: 600; opacity: 0.6; font-size: 11px; margin-left: 4px; }
    #results .cana .ct { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); margin-bottom: 4px; }
    #results .cana .ct b { min-width: 30px; color: var(--gm-accent, #ffd23a); }
    #results .cana .ct .lost { color: #ff7a6b; font-weight: 800; white-space: nowrap; }
    #results .cana .ct .tip { opacity: 0.9; }
    #results .cana .ct.ok { color: #5cff8a; }
    #results .cana .cchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    #results .cana .cc { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: rgba(255,255,255,0.08); white-space: nowrap; }
    #results .cana .cc.slow { background: rgba(255,90,74,0.25); }
    #results .cana .cc.fast { background: rgba(92,255,138,0.22); }
    /* 리플레이 (#results 안): 결과 카드는 숨기고 아래에 재생 막대만 */
    #results.rp { background: none; pointer-events: none; place-items: end center; }
    #results.rp > .res { display: none; }
    #rpBar { display: none; }
    #results.rp #rpBar { display: block; pointer-events: auto; margin: 0 16px 18px; padding: 10px 14px; width: min(760px, calc(100vw - 32px)); box-sizing: border-box; border-radius: 12px; background: rgba(8,12,24,0.78); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(6px); color: #f3f6fb; }
    #rpBar .rp-top { display: flex; gap: 12px; align-items: center; font-size: 14px; }
    #rpBar .rp-top .rp-car { font-weight: 800; }
    #rpBar .rp-top .rp-car i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    #rpBar .rp-top .rp-time { margin-left: auto; font-variant-numeric: tabular-nums; opacity: 0.85; }
    #rpBar .rp-seek { width: 100%; margin: 8px 0; accent-color: #ffd23a; }
    #rpBar .rp-btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    #rpBar .rp-btns .gm-btn { min-height: 40px; }
    body.replaying .hud, body.replaying #menuBtn, body.replaying #draftLines, body.replaying #fps { display: none !important; }
    /* 2라운드 (race): 배너·순위 변화·슬립스트림·출발 그리드 소개·시상대·챔피언십 */
    #racePosRow { display: flex; align-items: baseline; gap: 8px; }
    #posFlash { font-size: 18px; font-weight: 900; opacity: 0; }
    #posFlash.up { color: #7dff6a; }
    #posFlash.down { color: #ff6b5e; }
    #posFlash.go { animation: posFlash 1.6s ease-out; }
    @keyframes posFlash { 0% { opacity: 0; transform: translateY(6px) scale(0.8); } 12% { opacity: 1; transform: translateY(0) scale(1.25); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
    #banner { left: 50%; top: 96px; transform: translateX(-50%) translateY(-14px); opacity: 0; transition: opacity 0.3s, transform 0.3s; display: flex; flex-direction: column; align-items: center; padding: 8px 34px 9px; border-radius: 10px;
      background: linear-gradient(90deg, transparent, rgba(10, 14, 26, 0.88) 18%, rgba(10, 14, 26, 0.88) 82%, transparent); border-top: 2px solid var(--bc, #fff); border-bottom: 2px solid var(--bc, #fff); }
    #banner.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    #banner b { font-size: 26px; font-weight: 900; letter-spacing: 0.04em; color: var(--bc, #fff); font-style: italic; }
    #banner span { font-size: 14px; font-weight: 700; opacity: 0.85; font-variant-numeric: tabular-nums; }
    #banner.final { --bc: #ffffff; } #banner.final b { font-size: 34px; }
    #banner.laps { --bc: #ffd23a; }
    #banner.fastest { --bc: #c98bff; top: 150px; }
    #banner.champ { --bc: #ffb020; }
    #draftBox { right: 16px; bottom: 214px; opacity: 0; padding: 5px 12px; border-radius: 10px; background: rgba(20, 60, 90, 0.7); border: 1px solid #8fe3ff88; color: #bff0ff; font-size: 14px; font-weight: 900; letter-spacing: 0.05em; transition: opacity 0.2s; }
    #draftBox.on { animation: draftPulse 1.1s ease-in-out infinite alternate; }
    @keyframes draftPulse { from { box-shadow: 0 0 0 #8fe3ff00; } to { box-shadow: 0 0 14px #8fe3ff99; } }
    #draftLines { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.25s; z-index: 1;
      background:
        repeating-linear-gradient(90deg, transparent 0 46px, rgba(190, 240, 255, 0.10) 46px 48px, transparent 48px 110px),
        radial-gradient(ellipse at 50% 55%, transparent 42%, rgba(160, 230, 255, 0.10) 75%, rgba(160, 230, 255, 0.18) 100%);
      -webkit-mask-image: linear-gradient(90deg, #000 0 14%, transparent 30% 70%, #000 86%); mask-image: linear-gradient(90deg, #000 0 14%, transparent 30% 70%, #000 86%);
      animation: draftFlow 0.35s linear infinite; }
    @keyframes draftFlow { from { background-position: 0 0, 0 0; } to { background-position: 0 48px, 0 0; } }
    #introBox { left: 0; right: 0; bottom: 0; top: 0; display: none; pointer-events: none; }
    #introBox.on { display: block; }
    #introBox .it { position: absolute; left: 50%; top: 90px; transform: translateX(-50%); text-align: center; text-shadow: 0 3px 14px #000c; }
    #introBox .it b { display: block; font-size: 40px; font-weight: 900; font-style: italic; letter-spacing: 0.03em; }
    #introBox .it span { font-size: 16px; font-weight: 800; color: #ffd23a; }
    #introBox .ic { position: absolute; left: 7%; bottom: 120px; display: flex; align-items: center; gap: 14px; padding: 10px 22px 10px 12px; border-radius: 12px; background: rgba(8, 12, 22, 0.86); border-left: 8px solid var(--c); animation: introCard 0.35s ease-out; }
    #introBox .ic.me { box-shadow: 0 0 0 2px #ffd23a; }
    #introBox .ic em { font-style: normal; font-size: 38px; font-weight: 900; color: #fff; min-width: 54px; text-align: center; }
    #introBox .ic b { display: block; font-size: 24px; font-weight: 900; }
    #introBox .ic small { font-size: 13px; opacity: 0.75; }
    @keyframes introCard { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
    #introBox .ih { position: absolute; right: 24px; bottom: 24px; font-size: 13px; opacity: 0.7; font-weight: 700; }
    /* 결과: 시상대 */
    #results .podium { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin: 14px auto 2px; max-width: 420px; }
    #results .podium .pd { flex: 1; text-align: center; animation: podUp 0.6s ease-out both; }
    #results .podium .pd .who { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--gm-text, #fff); }
    #results .podium .pd .who i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
    #results .podium .pd small { display: block; font-size: 11px; opacity: 0.6; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #results .podium .blk { border-radius: 8px 8px 0 0; font-size: 26px; font-weight: 900; display: grid; place-items: center; color: #1b1300; }
    #results .podium .p1 .blk { height: 74px; background: linear-gradient(180deg, #ffe27a, #e0a422); }
    #results .podium .p2 .blk { height: 54px; background: linear-gradient(180deg, #eef2f7, #a9b3c2); }
    #results .podium .p3 .blk { height: 40px; background: linear-gradient(180deg, #f2b98a, #b8733e); }
    #results .podium .p1 { animation-delay: 0.35s; } #results .podium .p2 { animation-delay: 0.15s; } #results .podium .p3 { animation-delay: 0s; }
    #results .podium .pd.me .who { color: #ffd23a; }
    #results .podium.season .blk { box-shadow: 0 0 22px #ffd23a55; }
    @keyframes podUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
    /* 결과: 챔피언십 순위 */
    #results .champ { margin-top: 12px; padding: 10px 12px 4px; border-radius: 12px; background: rgba(255, 176, 32, 0.08); border: 1px solid rgba(255, 176, 32, 0.35); }
    #results .champ .ct { font-weight: 900; color: #ffb020; font-size: 15px; }
    #results .champ .cmaps { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin: 6px 0 0; }
    #results .champ .cmaps span { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,0.08); opacity: 0.6; }
    #results .champ .cmaps span.done { opacity: 1; background: rgba(255, 176, 32, 0.25); }
    #results .champ .cmaps span.now { box-shadow: 0 0 0 1px #ffb020; }
    #results .champ table.cst { margin: 8px 0 4px; font-size: 14px; }
    #results .champ table.cst tr.hd td { font-size: 11px; opacity: 0.6; font-weight: 800; }
    #results .champ table.cst td.nm { text-align: left; white-space: nowrap; }
    #results .champ table.cst td.nm i { display: inline-block; width: 6px; height: 14px; border-radius: 2px; margin-right: 7px; vertical-align: -2px; }
    #results .champ table.cst td.nm small { opacity: 0.7; font-size: 11px; }
    #results .champ table.cst td.gain { color: #7dff6a; font-weight: 800; }
    #results .champ table.cst tr.me { background: rgba(255, 207, 63, 0.18); font-weight: 800; }
    #results .res.final h2 { color: #ffd23a; }
    #results .res { position: relative; }
    #results .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
    #results .confetti i { position: absolute; top: -12px; width: 8px; height: 13px; border-radius: 2px; opacity: 0; animation: confetti 3s ease-in forwards; }
    @keyframes confetti { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), 640px) rotate(var(--rot)); } }
    #minimap { right: 16px; top: 16px; }
    #center { inset: 0; display: grid; place-items: center; }
    #startLights { left: 50%; top: 18px; transform: translateX(-50%); display: none; gap: 12px; padding: 10px 16px; background: #111c; border-radius: 14px; box-shadow: 0 4px 16px #0006; }
    #startLights i { width: 34px; height: 34px; border-radius: 50%; background: #3a1414; box-shadow: inset 0 -3px 0 #0006; transition: background 0.05s; }
    #startLights i.on { background: #ff2a1f; box-shadow: 0 0 16px #ff2a1fcc, inset 0 -3px 0 #0004; }
    #bigText { font-size: 120px; font-weight: 900; color: var(--accent); text-shadow: 0 6px 24px rgba(0,0,0,0.5); }
    #toast { left: 50%; top: 22%; transform: translateX(-50%); font-size: 32px; font-weight: 800; color: var(--accent); opacity: 0; transition: opacity 0.2s; }
    #help { left: 16px; bottom: 16px; font-size: 13px; line-height: 1.7; transition: opacity 0.4s; }
    #help { z-index: 2; }
    #help.hidden { opacity: 0; }
    #helpHint { left: 16px; bottom: 16px; font-size: 12px; opacity: 0.7; padding: 6px 10px; }
    @media (max-width: 1100px) { #help { bottom: 120px; } }
    #help b { display: inline-block; min-width: 72px; color: var(--accent); }
    /* 아래 가운데: 주행 모드 1~4 + 부스터 버튼 (키보드 또는 마우스로 누름) */
    #forms { left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; align-items: stretch; pointer-events: auto; }
    .mode, #boosterBtn { background: var(--hud-bg); border-radius: 12px; padding: 8px 12px; min-width: 92px; border: 2px solid transparent; cursor: pointer; user-select: none;
      transition: border-color 0.15s, box-shadow 0.15s, opacity 0.15s, transform 0.08s; opacity: 0.65; }
    .mode:hover, #boosterBtn:hover { opacity: 0.9; }
    .mode:active, #boosterBtn:active { transform: scale(0.95); }
    .mode .top, #boosterBtn .top { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 15px; }
    .mode .key, #boosterBtn .key { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: rgba(255,255,255,0.18); font-size: 13px; }
    .mode .hint, #boosterBtn .hint { margin-top: 3px; font-size: 11px; opacity: 0.75; }
    .mode.auto { cursor: default; pointer-events: none; }
    .mode.pulse { animation: modePulse 0.6s ease-out; }
    @keyframes modePulse { 0% { transform: scale(1.12); box-shadow: 0 0 24px var(--c); } 100% { transform: scale(1); } }
    .mode.on { opacity: 1; border-color: var(--c); box-shadow: 0 0 14px var(--c); background: color-mix(in srgb, var(--c) 22%, rgba(10, 14, 24, 0.55)); }
    #modeNormal { --c: #ffffff; }
    #modeAccel { --c: #ff7a2e; }
    #modeBoat { --c: #3fb8ff; }
    #modeFly { --c: #9ad8ff; }
    #boosterBtn { --c: #7dff6a; margin-left: 10px; min-width: 120px; opacity: 1; border-color: rgba(125, 255, 106, 0.55); }
    #boosterBtn .bar { margin-top: 5px; height: 6px; border-radius: 4px; background: rgba(255,255,255,0.18); overflow: hidden; }
    #boosterBtn .fill { height: 100%; width: 0%; background: var(--c); }
    #boosterBtn.active { border-color: #fff; box-shadow: 0 0 18px var(--c); background: color-mix(in srgb, var(--c) 35%, rgba(10, 14, 24, 0.55)); }
    #flightInfo { left: 50%; bottom: 96px; transform: translateX(-50%); font-size: 14px; font-weight: 800; color: #cfeeff; display: none; }
    #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 35%, var(--flash, #7dff6a) 130%); }
    @media (max-width: 640px) {
      #help { display: none; }
      #speed { font-size: 40px; }
      #bigText { font-size: 80px; }
    }
  </style>
  <!-- 홈 화면·ESC 메뉴·설정·결과·로딩 화면 스타일 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" />
  <link rel="stylesheet" href="src/menu.css" />
  <link rel="stylesheet" href="src/raceFx.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="flash"></div>

  <div id="leftCol" class="hud">
    <div id="topLeft" class="panel">
      <div id="lap">LAP 1/3</div>
      <div id="time">0:00.000</div>
      <div id="best">최고 랩 --:--.---</div>
      <div id="sectorRow"><div class="sec"><b>S1</b><span>-</span></div><div class="sec"><b>S2</b><span>-</span></div><div class="sec"><b>S3</b><span>-</span></div></div>
      <div id="ghostDelta"></div>
    </div>
    <!-- 레이스(봇·온라인)일 때만 보임: 순위, 앞·뒤 간격, 순위표 -->
    <div id="raceBox" class="panel">
      <div id="racePosRow"><div id="racePos">P-</div><div id="posFlash"></div></div>
      <div id="raceGaps"></div>
      <div id="tower"></div>
    </div>
  </div>

  <canvas id="minimap" class="hud panel" width="180" height="180"></canvas>

  <div id="speedBox" class="hud panel">
    <div id="speed">0</div>
    <div id="speedUnit">km/h</div>
    <div id="driftBar"><div id="driftFill"></div></div>
    <div id="driftAng" title="드리프트 각도: 초록 칸 안에서 버티면 드리프트가 쌓여요"><div id="driftWin"></div><div id="driftNeedle"></div></div>
    <div id="tachRow">
      <div id="tach"><div id="tachFill"></div><div id="tachGreen"></div><div id="tachRed"></div></div>
      <div id="gear">1</div>
    </div>
    <div id="gearInfo"><span id="tireState"></span><span id="shiftPerfect">완벽한 변속!</span><span id="gearMode">자동 · T</span></div>
  </div>

  <!-- 왼쪽 아래 조작법 안내는 없앰 (사용자 요청 2026-11-09). 조작법은 Esc 메뉴·홈 화면의 "조작법"에서 봄 -->
  <button id="menuBtn" title="메뉴 (Esc)">☰ 메뉴 · Esc</button>
  <div id="fps"></div>

  <div id="sinkWarn" class="hud">🌊 가라앉는 중! 3 = 배 모드</div>

  <div id="forms" class="hud">
    <!-- 모드는 자동으로 바뀜 (누를 수 없음, 지금 모드만 보여 줌) -->
    <div class="mode auto" id="modeNormal"><div class="top">🚗 일반</div><div class="hint">기본 주행</div></div>
    <div class="mode auto" id="modeAccel"><div class="top">🔥 가속</div><div class="hint">150 km/h 넘으면 자동</div></div>
    <div class="mode auto" id="modeBoat"><div class="top">🚤 배</div><div class="hint">물에 닿으면 자동</div></div>
    <div class="mode auto" id="modeFly"><div class="top">✈️ 비행</div><div class="hint">활주로에서 자동</div></div>
    <div id="boosterBtn" data-key="KeyE"><div class="top"><span class="key">E</span>🚀 부스터</div><div class="bar"><div class="fill"></div></div><div class="hint">무제한 · 3초</div></div>
  </div>
  <div id="flightInfo" class="hud"></div>

  <div id="startLights" class="hud"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="center" class="hud"><div id="bigText"></div></div>
  <div id="toast" class="hud"></div>
  <div id="lapSum" class="hud"></div>
  <!-- 2라운드: 띠 알림, 슬립스트림, 출발 그리드 소개 -->
  <div id="banner" class="hud"></div>
  <div id="draftLines"></div>
  <!-- 슬립스트림 충전 막대 + 견인 칩 (src/slipFx.js가 켜고 끔, 모양 src/raceFx.css) -->
  <div id="slipDock" class="hud">
    <div id="towBox" title="바로 앞차와 많이 벌어져서 앞차 쪽으로 끌어당겨 주는 중"><span class="tw-ico">🧲</span><b>견인</b><div class="tw-bar"><i></i></div></div>
    <div id="draftBox"><div class="sl-row"><span class="sl-ico">💨</span><b>슬립스트림</b><em>0%</em></div><div class="sl-bar"><i></i></div><div class="sl-tip">바짝 붙어서 충전 중…</div></div>
  </div>
  <div id="slingFlash"><b>⚡ 슬링샷!</b></div>
  <div id="introBox" class="hud"></div>

  <!-- 완주 결과 (hud.js가 채움) -->
  <div id="results"></div>

  <!-- 로딩 화면 (main.js가 맵·차 이름을 채움) -->
  <div id="loading"><div class="ld"><div class="logo">기믹 레이싱</div><div class="map" id="ldMap">&nbsp;</div><div class="car" id="ldCar"></div><div class="barx"><i></i></div><div class="tip" id="ldTip"></div></div></div>

  <script type="module">
    // 새로 올린 게임이 브라우저에 남은 예전 파일(캐시) 때문에 안 바뀌던 것 막기 (2026-11-13)
    //   deploy.sh가 version.json을 만듦 → 버전이 바뀌었으면 파일을 한 번 새로 받아 캐시를 바꾼 뒤 시작
    try {
      // 로컬 서버에는 배포용 version.json이 없으므로 요청하지 않음. 공개 주소의 캐시 갱신은 유지.
      const localDev = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
      const r = localDev ? null : await fetch('version.json', { cache: 'no-store' });
      if (r?.ok) {
        const ver = await r.json();
        let old = null; try { old = localStorage.getItem('gimmick.ver'); } catch {}
        if (ver.v && ver.v !== old) {
          await Promise.all((ver.files || []).map((f) => fetch(f, { cache: 'reload' }).catch(() => {})));
          try { localStorage.setItem('gimmick.ver', ver.v); } catch {}
        }
      }
    } catch {}
    await import('./src/main.js');
  </script>
